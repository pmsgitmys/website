<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - PhoneMax Electronics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: #f3f4f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        h1 {
            color: #1f2937;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }

        p {
            color: #6b7280;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .retry-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-right: 10px;
        }

        .retry-btn:hover {
            background: #2563eb;
        }

        .home-btn {
            background: #6b7280;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .home-btn:hover {
            background: #4b5563;
        }

        .features {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid #e5e7eb;
        }

        .feature {
            display: flex;
            align-items: center;
            text-align: left;
            margin-bottom: 1rem;
            color: #6b7280;
            font-size: 0.9rem;
        }

        .feature-icon {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            background: #3b82f6;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📱</div>
        <h1>You're Offline</h1>
        <p>It looks like you're not connected to the internet. Don't worry, you can still browse some of our cached products!</p>

        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
        <a href="/" class="home-btn">Go Home</a>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Browse cached products</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>View your wishlist</span>
            </div>
            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>Check order history</span>
            </div>
        </div>
    </div>

    <script>
        // Check for connection and reload when back online
        window.addEventListener('online', function() {
            window.location.reload();
        });

        // Show connection status
        if (navigator.onLine) {
            document.querySelector('p').innerHTML = 'Connection restored! <a href="/">Continue shopping</a>';
        }
    </script>
</body>
</html>
